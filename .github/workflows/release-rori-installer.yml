name: Release Rori Windows installer

on:
  push:
    tags:
      - 'rori-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse version from tag
        id: ver
        shell: pwsh
        run: |
          $t = '${{ github.ref_name }}' -replace '^rori-v',''
          "version=$t" >> $env:GITHUB_OUTPUT

      - name: Build RoriInstall payload and ZIP
        shell: pwsh
        run: |
          ./scripts/build-rori-installer.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build RoriSetup.exe
        shell: pwsh
        run: |
          ./scripts/build-rori-installer.ps1 -Version '${{ steps.ver.outputs.version }}' -Inno

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RoriInstall-${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/RoriInstall-${{ steps.ver.outputs.version }}-win-x64.zip.sha256
            artifacts/installer/RoriSetup-${{ steps.ver.outputs.version }}-win-x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
